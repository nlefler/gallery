<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nathan Lefler</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="assets/site.css">
  <script type="module" src="assets/site.js"></script>
</head>
<body>
  <header>
    <h1><a href="./">Nathan Lefler</a></h1>
    <nav class="tabs" aria-label="Galleries" hidden></nav>
  </header>
  <main>
    <p class="note" hidden></p>
    <div class="grid"></div>
  </main>
  <dialog class="viewer" aria-label="Photo">
    <div class="viewer-stage">
      <img class="viewer-img" alt="">
    </div>
    <button class="viewer-prev" type="button" aria-label="Previous photo">‹</button>
    <button class="viewer-next" type="button" aria-label="Next photo">›</button>
    <button class="viewer-close" type="button" aria-label="Close">✕</button>
    <div class="viewer-count" aria-live="polite"></div>
  </dialog>
  <noscript><p class="note">This gallery needs JavaScript.</p></noscript>
</body>
</html>
